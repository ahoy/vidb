name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    # Pinned, not ubuntu-latest: that label moved to Ubuntu 26.04 and silently
    # changed which interpreters the matrix below can install.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pyflakes
      - run: make lint

  test:
    # Pinned deliberately: ubuntu-latest already moved once and changed which
    # interpreters could be installed.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor claimed in pyproject.toml, and the newest CPython release.
        # 3.9 and 3.10 are end of life, so they are not supported.
        python-version: ["3.11", "3.14"]
    services:
      # Pinned to the versions the integration suite was written against; a
      # floating tag would silently test a dialect nobody has run.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vidb
          POSTGRES_PASSWORD: throwaway
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidb -d scratch"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: vidb
          MYSQL_PASSWORD: throwaway
          MYSQL_ROOT_PASSWORD: throwaway
          MYSQL_DATABASE: scratch
        ports:
          - 3306:3306
        # MySQL needs a while to initialise its data directory; without this
        # health check the tests start against a server that is not listening.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uvidb -pthrowaway --silent"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30
      # MariaDB implements `json` as longtext, so the same tests take a
      # different path through the JSON handling than they do on MySQL.
      mariadb:
        image: mariadb:11
        env:
          MARIADB_USER: vidb
          MARIADB_PASSWORD: throwaway
          MARIADB_ROOT_PASSWORD: throwaway
          MARIADB_DATABASE: scratch
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30
    env:
      VIDB_TEST_PG_URI: postgresql+psycopg://vidb:throwaway@127.0.0.1:5432/scratch
      VIDB_TEST_MYSQL_URI: mysql+pymysql://vidb:throwaway@127.0.0.1:3306/scratch
      VIDB_TEST_MARIADB_URI: mysql+pymysql://vidb:throwaway@127.0.0.1:3307/scratch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      # The PostgreSQL and MySQL suites skip themselves if their URI is unset,
      # so a broken service definition shows up as "skipped", not as a failure.
      - run: make test
